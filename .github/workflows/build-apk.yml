
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Fix minimum Android SDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          candidates = [
              project / "app" / "build.gradle.kts",
              project / "app" / "build.gradle",
          ]

          gradle_file = next((p for p in candidates if p.is_file()), None)

          if gradle_file is None:
              raise SystemExit("ERROR: App Gradle build file not found.")

          content = gradle_file.read_text()

          pattern = r'(\bminSdk\s*=\s*)\d+'
          updated, count = re.subn(pattern, r'\g<1>24', content, count=1)

          if count == 0:
              pattern = r'(\bminSdkVersion\s+)\d+'
              updated, count = re.subn(
                  pattern, r'\g<1>24', content, count=1
              )

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find a numeric minSdk setting. "
                  "Please inspect the app Gradle file."
              )

          gradle_file.write_text(updated)
          print(f"Updated minSdk to 24 in {gradle_file}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetDemo-debug-apk
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
